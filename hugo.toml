baseURL = 'https://ppaAndGitHub.github.io/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-cn'
title = '艳婷'
theme = 'PaperMod'
publishDir = 'docs'

[params]
  env = 'production'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.profileMode]
    enabled = true
    title = '艳婷'
    subtitle = '''
前端开发工程师 · 深圳

11 年 Web 前端经验 · Vue / React / UniApp
曾带领 3–5 人团队 · 7+ 小程序与跨端 App 上线
'''
    imageUrl = 'images/avatar.jpg'
    imageWidth = 160
    imageHeight = 160
    imageTitle = '艳婷'

    [[params.profileMode.buttons]]
      name = '关于我'
      url = 'about/'

    [[params.profileMode.buttons]]
      name = '工作经历'
      url = 'experience/'

    [[params.profileMode.buttons]]
      name = '爱好'
      url = 'hobbies/'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/ppaAndGitHub'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '主页'
    url = '/'
    weight = 10

  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 15

  [[menu.main]]
    identifier = 'experience'
    name = '经历'
    url = '/experience/'
    weight = 20

  [[menu.main]]
    identifier = 'hobbies'
    name = '爱好'
    url = '/hobbies/'
    weight = 25

  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']
